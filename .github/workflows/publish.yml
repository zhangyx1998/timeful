name: Publish

# Publishes dist/ to npm as the `timeful` package.
#
# Auth is npm "trusted publishing": npmjs.com is configured to trust this
# workflow file in this repository, npm exchanges the job's OIDC identity for
# a short-lived publish token, and provenance attestation comes with it. There
# is no NPM_TOKEN secret, and none should be added back — a long-lived token
# in a repo secret is exactly what this arrangement retires.
#
# Cutting a release is two commands from a clean main:
#
#     npm version minor        # bumps package.json, commits, tags vX.Y.Z
#     git push --follow-tags
#
# The tag push is the trigger. The version published is whatever is in the
# root package.json — the guard step refuses a tag that disagrees with it,
# and npm refuses a version that already exists on the registry. A GitHub
# release for the tag is optional and cosmetic; nothing here depends on one.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # the OIDC identity trusted publishing exchanges for a token

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm >= 11.5.1. Do not depend on whichever
      # npm the runner's Node happens to bundle.
      - run: npm install -g npm@latest

      - run: npm ci

      - name: Refuse a tag that disagrees with package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json ($version)." >&2
            exit 1
          fi

      # The same gates as CI, in the same order: build before test, because
      # the CLI tests serve assets out of dist/. A tag is a bad place to
      # discover a broken test.
      - run: npm run typecheck
      - run: npm run build
      - run: npx vitest run

      # dist/ is the package: its own generated package.json, no dependencies
      # to install, and the CLI as its bin. The root package is private.
      - run: npm publish dist/ --provenance --access public
