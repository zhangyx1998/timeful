name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to the same branch makes an in-flight run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  app:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # `npm run build` runs the typecheck itself, but running it as its own
      # step means a type error is reported as a type error rather than as a
      # build failure.
      - run: npm run typecheck

      # Build before testing: the CLI tests spawn the real `timeful` and the
      # ones that reach "server on ..." serve assets out of dist/, which a
      # fresh runner does not have until the build writes it.
      - run: npm run build
      - run: npx vitest run

  docs:
    name: Build docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # docs/ is a standalone package, not a workspace: its own lockfile, its
      # own install, and no way for a docs dependency to reach the app.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - run: npm ci
        working-directory: docs

      - run: npm run build
        working-directory: docs
