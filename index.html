<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- `viewport-fit=cover` lets the app paint the whole display on a phone
         with a notch or a home indicator; everything fixed to an edge pads
         itself back off it with the `--safe-*` tokens. No `maximum-scale` and
         no `user-scalable`: pinch to zoom is not ours to take away. -->
    <!-- `interactive-widget=overlays-content` keeps the on-screen keyboard
         *out* of the layout viewport. `resizes-content` was the other way
         round, and it meant every keystroke-summoning tap relaid the whole app
         out: the phone layout is `height: 100dvh` with a chart sized off what
         is left, so raising the keyboard shrank the chart, moved every column,
         and dropped it all again on dismiss. The keyboard is a thing that
         covers the page, not a thing that resizes it — so the page holds still
         and whatever has to stay visible above it pads itself off
         `env(keyboard-inset-height)` / `--keyboard-inset` instead, the way
         everything fixed to an edge already pads off `--safe-*`.
         See src/lib/keyboard.ts. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=overlays-content"
    />
    <meta name="color-scheme" content="light dark" />
    <!-- What the browser tints its own chrome with. Both values are
         `--color-surface` from src/styles/tokens.css — the colour of the app
         header and of the phone's identity bar, which are what sit against the
         top and bottom chrome — and there is a note beside the token saying so.
         Without them iOS Safari samples the page behind its bottom toolbar and
         picks up the page background, which is a shade darker than the bar
         above it and reads as a seam across the screen.

         The script below drops the `media` from whichever of these matches an
         explicit override, and src/lib/theme-color.ts prepends a third that
         tracks the token at runtime. Both work off these values rather than
         restating them. -->
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#202127" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/favicon.ico" />
    <!-- The manifest exists for Web Push: iOS only delivers push to a page
         that has been added to the home screen, and adding wants a manifest
         and real PNG icons. `start_url` is deliberately absent, so an install
         opens the page it was made from — an event page for a respondent, the
         admin app for the owner. There is no offline mode behind this; the
         one service worker (public/push-sw.js) has no fetch handler. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Timeful</title>
    <script>
      // Applies the stored theme override before first paint so there is no
      // flash of the wrong theme. No stored value = follow prefers-color-scheme,
      // which tokens.css handles on its own. Storage can throw (private mode,
      // blocked cookies), and this file is also the SSR template for event
      // pages, so it must never break the document. See src/lib/theme.ts.
      (function () {
        try {
          var stored = window.localStorage.getItem("timeful.theme");
          if (stored === "light" || stored === "dark") {
            document.documentElement.setAttribute("data-theme", stored);
            // The theme-color pair above is keyed off prefers-color-scheme, so
            // an override would leave the browser tinting its chrome for the
            // theme the page is no longer in. Rather than restate a colour
            // here — which could drift from the tokens — keep the one that
            // matches and make it unconditional.
            var metas = document.querySelectorAll("meta[name=theme-color][media]");
            for (var i = 0; i < metas.length; i++) {
              if (metas[i].media.indexOf(stored) === -1) metas[i].remove();
              else metas[i].removeAttribute("media");
            }
          }
        } catch (error) {
          /* keep the system default */
        }
      })();
    </script>
    <!--app-head-->
  </head>
  <body>
    <div id="app"><!--app-html--></div>
    <script type="module" src="/src/entry-client.ts"></script>
  </body>
</html>
